[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmcore"
version = "0.1.0"
description = "SwarmCore: детерминированный симулятор роя БПЛА (MVP-0)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
swarmcore = "apps.cli:main"

[tool.setuptools.packages.find]
include = ["swarmsim*", "apps*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
