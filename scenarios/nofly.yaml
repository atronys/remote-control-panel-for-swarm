# Бесполётная зона в центре. Точки «змейки» внутри зоны выбрасываются; переходы между
# секторами пока могут её пересекать — это ловит World (N_geo) до появления планировщика/валидатора R2.
name: nofly
t_end: 1800
dt: 0.1
world:
  size: [1000, 1000]
  targets: 30
  nofly:
    - [[400, 400], [600, 400], [600, 600], [400, 600]]
agents: {count: 10, motion: kinematic}
